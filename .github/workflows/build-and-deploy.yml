name: Build, Push & Deploy (GHCR -> VPS)

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["CI"]   # Must match the CI workflow name exactly
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push-develop:
    name: Build & Push (develop -> latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neuraal:latest
            ghcr.io/${{ github.repository_owner }}/neuraal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-develop:
    name: Deploy (develop)
    runs-on: ubuntu-latest
    needs: build-and-push-develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            cd /srv/neuraal

            # 1) Use workflow_run head SHA when available, otherwise push SHA
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
            IMAGE="ghcr.io/${{ github.repository_owner }}/neuraal:$TAG"
            echo "Deploying image: $IMAGE"

            # 2) Update APP_IMAGE in .env.prod so compose uses the exact SHA image
            if grep -q '^APP_IMAGE=' .env.prod; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env.prod
            else
              echo "APP_IMAGE=$IMAGE" >> .env.prod
            fi

            # 3) Login to GHCR (private registry)
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin

            # 4) Pull exact tag + migrate + up
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm app pnpm prisma migrate deploy
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            # 5) Save last deployed image for quick rollback reference
            echo "$IMAGE" > .last_deploy_image
            echo "Last deployed image: $IMAGE"

  build-and-push-main:
    name: Build & Push (main after CI)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neuraal:latest
            ghcr.io/${{ github.repository_owner }}/neuraal:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-main:
    name: Deploy (main)
    runs-on: ubuntu-latest
    needs: build-and-push-main
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            cd /srv/neuraal

            # 1) Use workflow_run head SHA when available, otherwise push SHA
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
            IMAGE="ghcr.io/${{ github.repository_owner }}/neuraal:$TAG"
            echo "Deploying image: $IMAGE"

            # 2) Update APP_IMAGE in .env.prod so compose uses the exact SHA image
            if grep -q '^APP_IMAGE=' .env.prod; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env.prod
            else
              echo "APP_IMAGE=$IMAGE" >> .env.prod
            fi

            # 3) Login to GHCR (private registry)
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin

            # 4) Pull exact tag + migrate + up
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm app pnpm prisma migrate deploy
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            # 5) Save last deployed image for quick rollback reference
            echo "$IMAGE" > .last_deploy_image
            echo "Last deployed image: $IMAGE"

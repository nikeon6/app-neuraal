# Neuraal - Local Development Environment
# Postgres (pgvector) + Redis (BullMQ) + MinIO (S3) + n8n (Automation)

services:
  # ==========================================================================
  # PostgreSQL with pgvector extension
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuraal-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: neuraal
      POSTGRES_USER: neuraal
      POSTGRES_PASSWORD: neuraal_password
    volumes:
      - neuraal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuraal -d neuraal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis for BullMQ job queues
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: neuraal-redis
    ports:
      - "6379:6379"
    volumes:
      - neuraal_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO - S3-compatible object storage for attachments
  # Console: http://localhost:9001 (minioadmin / minioadmin_password)
  # S3 API:  http://localhost:9000
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: neuraal-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    command: server /data --console-address ":9001"
    volumes:
      - neuraal_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO Init - One-shot container to create the bucket automatically
  # ==========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: neuraal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin_password;
      mc mb local/neuraal --ignore-existing;
      mc anonymous set none local/neuraal;
      echo 'Bucket neuraal created successfully';
      exit 0;
      "

  # ==========================================================================
  # n8n - Workflow automation platform
  # UI: http://localhost:5678 (neuraal / neuraal_password via basic auth)
  # Uses SQLite for simplicity in local development
  # ==========================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: neuraal-n8n
    ports:
      - "5678:5678"
    environment:
      # Host configuration
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # Variable para la firma HMAC
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      # Security (change these in production!)
      N8N_ENCRYPTION_KEY: dev_encryption_key_change_me_32chars!
      N8N_USER_MANAGEMENT_JWT_SECRET: dev_jwt_secret_change_me_in_prod!
      # Basic auth for local dev
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: neuraal
      N8N_BASIC_AUTH_PASSWORD: neuraal_password
      # Timezone
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      # Disable telemetry for local dev
      N8N_DIAGNOSTICS_ENABLED: "false"
      # LangSmith (LangChain) - preparado
      LANGCHAIN_ENDPOINT: "https://eu.api.smith.langchain.com"
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT}
      LANGCHAIN_CALLBACKS_BACKGROUND: "true"
      # Environment variables
      N8N_ENV_VARS_ENABLED: "N8N_WEBHOOK_SECRET,LANGCHAIN_API_KEY,LANGCHAIN_PROJECT"
      # Allow built-in Node.js modules in Code nodes (crypto for HMAC)
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      # Allow $env access in Code nodes
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - neuraal_n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # Ollama - Local LLM inference server
  # API: http://localhost:11434
  # ==========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: neuraal-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"        # Never unload models from RAM (eliminates cold-start)
      OLLAMA_NUM_PARALLEL: "2"       # Allow 2 simultaneous requests (safe with 16GB RAM)
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"   # glm-ocr + qwen3-embedding loaded at once
    volumes:
      - neuraal_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Ollama Init - One-shot container to pull models
  # Models: qwen3-embedding:latest (embeddings, 8b), glm-ocr:q8_0 (OCR)
  # Previous models: qwen3-embedding:4b, glm-ocr:latest, nomic-embed-text-v2-moe:latest
  # ==========================================================================
  ollama-init:
    image: curlimages/curl:latest
    container_name: neuraal-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling qwen3-embedding:latest (8b)...';
      curl -sf --max-time 600 http://ollama:11434/api/pull -d '{\"name\":\"qwen3-embedding:latest\",\"stream\":false}';
      echo '';
      echo 'Pulling glm-ocr:q8_0...';
      curl -sf --max-time 600 http://ollama:11434/api/pull -d '{\"name\":\"glm-ocr:q8_0\",\"stream\":false}';
      echo '';
      echo 'All models pulled successfully';
      echo 'Warming up glm-ocr:q8_0 (preloading into RAM)...';
      curl -sf --max-time 120 http://ollama:11434/api/generate -d '{\"model\":\"glm-ocr:q8_0\",\"prompt\":\"hello\",\"stream\":false}' > /dev/null;
      echo 'Warmup complete — glm-ocr:q8_0 is loaded in RAM';
      exit 0;
      "

  # ==========================================================================
  # WAHA - WhatsApp HTTP API (self-hosted) [DEPRECATED - replaced by Evolution API]
  # ==========================================================================
  # waha:
    # image: devlikeapro/waha
    # container_name: neuraal-waha
    # restart: always
    # ports:
      # - "3009:3000"
    # environment:
      # WAHA_API_KEY: f07c98acf04c4f4eac21dc94aca9e2d6
      # WAHA_DASHBOARD_NO_PASSWORD: "True"
      # WHATSAPP_SWAGGER_NO_PASSWORD: "True"
      # WHATSAPP_DEFAULT_ENGINE: NOWEB
      # WHATSAPP_RESTART_ALL_SESSIONS: "True"
    # volumes:
      # - neuraal_waha_sessions:/app/.sessions

  # ==========================================================================
  # Evolution DB Init - One-shot container to create the evolution database
  # in the shared PostgreSQL instance (runs only once per volume lifecycle)
  # ==========================================================================
  evolution-db-init:
    image: pgvector/pgvector:pg16
    container_name: neuraal-evolution-db-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      PGPASSWORD=neuraal_password psql -h postgres -U neuraal -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'evolution'\"
      | grep -q 1
      || PGPASSWORD=neuraal_password createdb -h postgres -U neuraal evolution;
      echo 'Database evolution is ready';
      exit 0;
      "

  # ==========================================================================
  # Evolution API - Multi-channel messaging (WhatsApp, Telegram, etc.)
  # Dashboard: http://localhost:8080
  # Swagger:   http://localhost:8080/docs
  # ==========================================================================
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: neuraal-evolution-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-db-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      # Authentication
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      # Database (PostgreSQL) — shared Postgres instance, dedicated "evolution" database
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://neuraal:neuraal_password@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      # Cache Redis — shared Redis instance with dedicated prefix
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - neuraal_evolution_instances:/evolution/instances

# ==========================================================================
# Named volumes for data persistence
# ==========================================================================
volumes:
  neuraal_pgdata:
  neuraal_redisdata:
  neuraal_minio_data:
  neuraal_n8n_data:
  neuraal_ollama_data:
  neuraal_evolution_instances:

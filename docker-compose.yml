# Neuraal - Local Development Environment
# Postgres (pgvector) + Redis (BullMQ) + MinIO (S3) + n8n (Automation)

services:
  # ==========================================================================
  # PostgreSQL with pgvector extension
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuraal-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: neuraal
      POSTGRES_USER: neuraal
      POSTGRES_PASSWORD: neuraal_password
    volumes:
      - neuraal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuraal -d neuraal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis for BullMQ job queues
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: neuraal-redis
    ports:
      - "6379:6379"
    volumes:
      - neuraal_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO - S3-compatible object storage for attachments
  # Console: http://localhost:9001 (minioadmin / minioadmin_password)
  # S3 API:  http://localhost:9000
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: neuraal-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    command: server /data --console-address ":9001"
    volumes:
      - neuraal_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO Init - One-shot container to create the bucket automatically
  # ==========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: neuraal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin_password;
      mc mb local/neuraal --ignore-existing;
      mc anonymous set none local/neuraal;
      echo 'Bucket neuraal created successfully';
      exit 0;
      "

  # ==========================================================================
  # n8n - Workflow automation platform
  # UI: http://localhost:5678 (neuraal / neuraal_password via basic auth)
  # Uses SQLite for simplicity in local development
  # ==========================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: neuraal-n8n
    ports:
      - "5678:5678"
    environment:
      # Host configuration
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      # Variable para la firma HMAC
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      # Security (change these in production!)
      N8N_ENCRYPTION_KEY: dev_encryption_key_change_me_32chars!
      N8N_USER_MANAGEMENT_JWT_SECRET: dev_jwt_secret_change_me_in_prod!
      # Basic auth for local dev
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: neuraal
      N8N_BASIC_AUTH_PASSWORD: neuraal_password
      # Timezone
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      # Disable telemetry for local dev
      N8N_DIAGNOSTICS_ENABLED: "false"
      # LangSmith (LangChain) - preparado
      LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-neuraal-dev}
      LANGCHAIN_CALLBACKS_BACKGROUND: "true"
      # Environment variables
      N8N_ENV_VARS_ENABLED: "N8N_WEBHOOK_SECRET,LANGCHAIN_API_KEY,LANGCHAIN_PROJECT"
      # Allow built-in Node.js modules in Code nodes (crypto for HMAC)
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      # Allow $env access in Code nodes
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - neuraal_n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # Ollama - Local LLM inference server
  # API: http://localhost:11434
  # Using 0.15.5-rc1 for glm-ocr support (revert to :latest when 0.15.5 is stable)
  # ==========================================================================
  ollama:
    image: ollama/ollama:0.15.5-rc1
    container_name: neuraal-ollama
    ports:
      - "11434:11434"
    volumes:
      - neuraal_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Ollama Init - One-shot container to pull models
  # Models: nomic-embed-text-v2-moe (embeddings), glm-ocr (OCR)
  # ==========================================================================
  ollama-init:
    image: ollama/ollama:0.15.5-rc1
    container_name: neuraal-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling nomic-embed-text-v2-moe:latest...';
      ollama pull nomic-embed-text-v2-moe:latest;
      echo 'Pulling glm-ocr:latest...';
      ollama pull glm-ocr:latest;
      echo 'All models pulled successfully';
      exit 0;
      "

# ==========================================================================
# Named volumes for data persistence
# ==========================================================================
volumes:
  neuraal_pgdata:
  neuraal_redisdata:
  neuraal_minio_data:
  neuraal_n8n_data:
  neuraal_ollama_data:
